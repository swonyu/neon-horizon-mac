name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install check dependencies
        run: |
          python -m pip install 'Pillow==12.3.0' 'numpy==2.3.5'
          brew install lua@5.4
      - name: Check source, recovery, generated wallpaper and Dock
        run: |
          python tests/check.py
          python tests/dock-selfcheck.py
      - name: Check desktop controls without operating the desktop
        working-directory: tests
        run: |
          neon_lua="$(brew --prefix lua@5.4)/bin/lua"
          "$neon_lua" edge-selfcheck.lua
          "$neon_lua" shortcuts-selfcheck.lua
